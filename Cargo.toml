[package]
name = "nestwatch"
version = "0.3.0"
edition = "2024"
license = "MIT"
# Matches the pin in rust-toolchain.toml, which CI and local builds both use — so this is the
# version the project is actually built and tested with, not an aspirational floor.
rust-version = "1.96.0"
# Private tool — guard against accidental `cargo publish` to crates.io.
publish = false

# Lint policy lives here, not only on CI's command line.
#
# CI runs `cargo clippy --all-targets -- -D warnings`, which binds *there*. A `-D` flag cannot
# bind here: locally `cargo clippy` warns where CI fails, and rust-analyzer — the surface these
# lints are actually read on, while typing — never sees the policy at all. That is the same
# local/CI divergence `build.rs` already warns about for the toolchain, and for the same reason:
# a rule that only exists in the pipeline is discovered at push time instead of at write time.
#
# Each entry below is a property this codebase already holds; every one was verified to produce
# zero warnings before being added, so these lock in the status quo rather than opening a
# cleanup. Lints that would have required edits elsewhere were deliberately left out —
# `unused_qualifications` (9 sites, all in `curfew.rs`/`rules.rs`) is real but lands in the
# enforcement path, and `missing_docs` (84) / `str_to_string` (36) are churn for a binary crate
# nobody depends on. Adopt those with their own change, if at all — not as a side effect of this.
[lints.rust]
# Edition 2024 makes this a warning. It is a denial here because every `unsafe` in this crate is
# FFI into Win32, where the unmarked-operation case is exactly the one worth failing on.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
# Allow-by-default (a `restriction` lint), so CI's `-D warnings` never switched it on. Turning it
# on found four of the crate's eight `unsafe` blocks putting their justification in the function's
# `///` doc comment rather than a `// SAFETY:` line above the block — the reasoning was written,
# just not where the block is read, and not where the two blocks in `spawn_lock`/`spawn_and_capture`
# already put it. All eight now match. Note this only bites under `--target x86_64-pc-windows-gnu`:
# every `unsafe` here is `#[cfg(windows)]`, so a host-target clippy run sees none of them.
undocumented_unsafe_blocks = "deny"
# A stub that compiles is worse here than one that doesn't: an unreached `todo!()` on the
# enforcement path means the limit silently isn't applied, which looks identical to a well-behaved
# child until the bill arrives.
todo = "deny"
unimplemented = "deny"
# This ships as a SYSTEM service writing to a log the parent reads. `dbg!` output there is noise
# in the one file consulted when something is wrong.
dbg_macro = "deny"

[dependencies]
anyhow = "1.0.103"
argon2 = "0.5"
# tower-sessions declares `SessionStore` with `#[async_trait]`, so our file-backed store has to
# be annotated the same way. Already in the graph via tower-sessions — no new crate.
async-trait = "0.1"
axum = "0.8.9"
axum-server = { version = "0.8", default-features = false, features = ["tls-rustls-no-provider"] }
# JPEG encoding only (screenshots). Default features drag in the whole decode stack — AV1
# (rav1e/ravif), EXR, TIFF, WebP — ~54 crates this app never calls, since nothing here
# ever *decodes* an image. xcap already declares image correctly; feature unification means
# this declaration is what pulls the rest in.
#
# This was `["png"]` until the capture path grew two tiers. Both encode JPEG, so nothing here
# writes a PNG any more and the feature came out of *this* declaration. It does not leave the
# build: `xcap` declares `image = { features = ["png"], default-features = false }` itself, and
# feature unification means the png stack (`png`, `flate2`, `miniz_oxide`, `fdeflate`,
# `crc32fast`, `adler2`, `simd-adler32`) stays for as long as xcap is a dependency. Verified with
# `cargo tree -i png --target x86_64-pc-windows-gnu`, after predicting the opposite and being
# wrong. So the cost of JPEG is exactly **two** crates, `zune-core` and `zune-jpeg`, and asking
# for `["jpeg"]` alone here is honest about what this crate uses rather than a saving.
#
# Why JPEG at all, given the tool shipped lossless for a year: a 4K desktop showing a game is
# 20,641 KiB of PNG and 979 KiB of q70 JPEG, measured through this exact encoder. Live mode fired
# the first of those every three seconds. Raising PNG's compression instead was measured too and
# is far worse — 63% smaller for 1,477 ms per frame, against 44.7 ms today.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
pem = "4"
# Renders the pairing URL as a QR in the install console. `default-features = false` drops its
# image/SVG renderers (which would pull `image`'s decode stack back in) and leaves it with ZERO
# transitive dependencies — we only use the built-in unicode half-block renderer.
qrcode = { version = "0.14", default-features = false }
rpassword = "7.5.4"
# Not imported directly (we reach it via `argon2::password_hash::rand_core`) — this entry exists
# to turn ON its `getrandom` feature, which is what makes `OsRng` available at all. Removing it
# breaks password hashing and time-code generation. `cargo machete` flags it as unused; it isn't.
rand_core = { version = "0.6", features = ["getrandom"] }
rust-embed = { version = "8", features = ["mime-guess"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "time", "sync"] }
tower = { version = "0.5.3", features = ["util"] }
tower-sessions = "0.15"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-appender = "0.2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
sha2 = "0.11"
time = { version = "0.3.53", default-features = false, features = ["std"] }

# Keep the shipped .exe small and self-contained.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".dependencies]
# Screen capture is only used on Windows (control/windows.rs); keeping it Windows-only
# avoids pulling X11/Wayland system deps into Linux/macOS builds and CI.
#
# `features = ["wgc"]` is LOAD-BEARING and must never be dropped back to a bare `xcap = "0.9"`.
# xcap declares **no `default` feature list at all**, so a bare dependency silently compiles the
# `#[cfg(not(feature = "wgc"))]` arm of `src/windows/capture.rs` — GDI `BitBlt` against the
# DWM-composited desktop. That captures a normal desktop perfectly and returns **black** for
# anything that bypasses composition: a game in exclusive fullscreen, and DRM video. Exclusive
# fullscreen is a radio button in any game's display settings, so the failure is not an edge case,
# it is an evasion the child can select. It also produces no warning, no error and no failing
# test — which is why `control::tests::the_capture_backend_is_named_not_defaulted` now pins it.
#
# Two consequences, both deliberate:
#   * The two paths are mutually exclusive at COMPILE time — xcap's `mod.rs` gates `mod gdi` on
#     `cfg(not(feature = "wgc"))` — so turning this on removes the GDI fallback entirely. There is
#     no runtime `IsSupported()` arrangement available here; `preflight` checks the OS build
#     instead and **cautions — it does not block**. A pre-1903 machine installs, runs, enforces
#     everything else, and simply cannot capture. That is `check_windows_build`'s deliberate
#     choice (see its doc: refusing to install would take a working parental control away to
#     protect one feature of it), so the compensating control here is a warning a human reads,
#     not a gate. Do not read this entry as "the pre-1903 case is handled".
#   * `CreateForMonitor` needs Windows 10 **1903** (10.0.18362). Note the trap: this codebase cites
#     **1803** twice, for Interactive Service Detection, so the wrong number is the familiar one.
#
# Costs no new crate: `wgc` only switches on features of the `windows` crate below.
xcap = { version = "0.9", features = ["wgc"] }
# `Win32_UI_HiDpi` is for `SetProcessDpiAwarenessContext` in `control/windows.rs`. Without it the
# capture helper is DPI-*unaware*, so its desktop DC is virtualised to logical pixels while xcap
# asks `EnumDisplaySettingsW` for the rectangle in physical ones — a mismatch that leaves over half
# the frame outside the source surface at the 150% scaling Windows picks for a 4K laptop panel.
#
# `Win32_System_Time` is for `GetDynamicTimeZoneInformation` in `clock.rs`. It reads the time-zone
# *identity* (key name + the "adjust for DST automatically" flag) rather than the offset, because
# the offset is ambiguous — Amsterdam in winter and London in summer are both +60, which is what
# let a child substitute a zone and keep the old offset check happy. Costs no new crate.
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_System_Threading", "Win32_System_Environment", "Win32_System_StationsAndDesktops", "Win32_System_Pipes", "Win32_System_SystemInformation", "Win32_System_Time", "Win32_UI_WindowsAndMessaging", "Win32_UI_Accessibility", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_HiDpi", "Wdk_System_SystemServices"] }
windows-service = "0.8.1"
