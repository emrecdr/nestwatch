# Supply-chain policy for `cargo deny`, run as a BLOCKING CI gate.
#
# Scoped to the shipped target on purpose. `cargo audit` scans Cargo.lock, which lists crates that
# never compile on Windows — xcap pulls a Linux/Wayland backend whose dependencies carry
# advisories. That produced a permanently-red advisory job, so it was made non-blocking with a
# growing list of `--ignore` flags, which is the same as not having a gate: a real advisory would
# have landed in a job nobody looks at.
#
# Resolving the graph for the Windows target instead makes those crates legitimately absent, so
# this can fail the build with NO ignores. If something is ignored here in future it should be
# because it was assessed, not because the job was noisy.
[graph]
targets = ["x86_64-pc-windows-msvc"]

[advisories]
version = 2

[bans]
# Duplicate versions are informational — a few are unavoidable transitively.
multiple-versions = "warn"

# "Nothing leaves the house" is the product. SECURITY.md states it as a fact about this repo —
# "`src/` contains no HTTP client" — and until now nothing checked it. The dashboard's update
# check runs in the parent's browser and is constrained by the CSP, which a test pins; but a CSP
# is enforced by the *browser* and says nothing about the service. Adding one convenient outbound
# call to `src/` would keep every existing gate green while breaking the promise the whole design
# rests on.
#
# So the check lives where a dependency actually enters: `cargo deny check bans` already runs as a
# blocking CI job with no ignores. Adding a crate below is now a deliberate act with a review
# attached, which is the point — this is a tripwire, not a security boundary.
#
# `hyper` is absent from this list on purpose: axum serves on it, so it cannot be banned. Someone
# determined could still reach for its client. This catches the realistic case — a contributor
# reaching for the obvious crate — not an adversary inside the repo.
deny = [
  { crate = "reqwest", reason = "HTTP client — the monitored PC must make no outbound request" },
  { crate = "ureq", reason = "HTTP client — see above" },
  { crate = "isahc", reason = "HTTP client — see above" },
  { crate = "attohttpc", reason = "HTTP client — see above" },
  { crate = "surf", reason = "HTTP client — see above" },
  { crate = "minreq", reason = "HTTP client — see above" },
  { crate = "curl", reason = "HTTP client — see above" },
  { crate = "curl-sys", reason = "HTTP client — see above" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
version = 2
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "MPL-2.0", "CC0-1.0", "BSL-1.0", "Unlicense", "OpenSSL",
]
