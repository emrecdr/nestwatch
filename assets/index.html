<!DOCTYPE html>
<html lang="en" data-theme="dim">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Host Health</title>
    <!-- Inline so there is no second request and no 404 on every page load, which is what the
         browser did before this. Matches the heading on the sign-in screen, and stays as
         non-committal as the <title> deliberately is. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%A9%BA%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/app.css" />
    <!-- app.js before alpine.min.js, and this order is load-bearing: both are deferred, deferred
         scripts run in document order, and `x-data="app()"` needs the global to exist by the time
         Alpine starts. Reversed, the dashboard renders blank. Externalised so the script can be
         linted and tested, and so `script-src` no longer needs 'unsafe-inline'. -->
    <script defer src="/app.js"></script>
    <script defer src="/alpine.min.js"></script>
  </head>
  <body class="min-h-screen bg-base-200" x-data="app()" x-init="init()" x-cloak>
    <!-- ── Loading gate ─────────────────────────────────────────────── -->
    <template x-if="authed === null">
      <div class="flex min-h-screen items-center justify-center">
        <span class="loading loading-spinner loading-lg text-primary"></span>
      </div>
    </template>

    <!-- ── Login ────────────────────────────────────────────────────── -->
    <template x-if="authed === false">
      <div class="flex min-h-screen items-center justify-center p-4">
        <div class="card w-full max-w-sm bg-base-100 shadow-xl">
          <form class="card-body" @submit.prevent="login()">
            <h1 class="card-title justify-center text-2xl">🩺 Host Health</h1>
            <p class="text-center text-sm opacity-70">Sign in to continue</p>

            <label class="form-control w-full mt-2">
              <span class="label-text mb-1">Password</span>
              <input
                type="password"
                x-model="password"
                :disabled="busy"
                autofocus
                autocomplete="current-password"
                class="input input-bordered w-full"
                placeholder="••••••••"
              />
            </label>

            <template x-if="loginError">
              <div class="alert alert-error text-sm py-2" x-text="loginError"></div>
            </template>

            <button class="btn btn-primary mt-2" :disabled="busy || !password">
              <span x-show="busy" class="loading loading-spinner loading-sm"></span>
              Sign in
            </button>
          </form>
        </div>
      </div>
    </template>

    <!-- ── Dashboard ────────────────────────────────────────────────── -->
    <template x-if="authed === true">
      <div>
        <div class="navbar bg-base-100 shadow">
          <div class="flex-1 px-2 text-lg font-semibold">🪺 Nestwatch</div>
          <div class="flex-none items-center gap-2">
            <span class="badge badge-warning gap-1" x-show="timeRequests.length > 0"
                  x-text="`${timeRequests.length} request${timeRequests.length === 1 ? '' : 's'}`"></span>
            <button class="btn btn-info btn-sm" @click="doLock()">🔒 Lock</button>
            <button class="btn btn-warning btn-sm" @click="confirmShutdown = true">⏻ Shut down</button>
            <button class="btn btn-ghost btn-sm" @click="logout()">Log out</button>
          </div>
        </div>

        <!-- Width steps up with the screen instead of stopping at 1024px. Eight of the ten
             cards below are md:col-span-2, and almost all of them hold tables, charts or rows of
             controls -- content that reads better wide, unlike prose. Still capped rather than
             full-bleed: on a 4K monitor an uncapped grid gives one 3800px-wide table row, where
             the eye loses which value belongs to which column. -->
        <main
          class="mx-auto grid w-full max-w-5xl gap-4 p-4 md:grid-cols-2 xl:max-w-7xl 2xl:max-w-[110rem]"
        >
          <!-- Screenshot -->
          <section class="card bg-base-100 shadow">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Screen</h2>
                <div class="flex items-center gap-2">
                  <label class="label cursor-pointer gap-2 py-0">
                    <span class="label-text text-xs">Live</span>
                    <input type="checkbox" class="toggle toggle-primary toggle-sm"
                           x-model="autoRefresh" @change="toggleAutoRefresh()" />
                  </label>
                  <button class="btn btn-ghost btn-sm" @click="shotFull = true"
                          :disabled="!shotUrl" title="Expand to fill the window (Esc to close)">
                    ⤢ Expand
                  </button>
                  <button class="btn btn-primary btn-sm" @click="takeScreenshot()" :disabled="loadingShot">
                    <span x-show="loadingShot" class="loading loading-spinner loading-xs"></span>
                    Take screenshot
                  </button>
                </div>
              </div>
              <div class="mt-2 flex min-h-48 items-center justify-center rounded-lg bg-base-300">
                <template x-if="!shotUrl && !loadingShot">
                  <span class="opacity-50">No screenshot yet</span>
                </template>
                <template x-if="shotUrl">
                  <!-- The thumbnail is deliberately capped: this card shares a row, and a 4K
                       desktop shrunk into it is unreadable anyway. Clicking opens the full-size
                       view, which is where you actually look at what he is doing. -->
                  <img :src="shotUrl" alt="screen of the monitored PC — click to enlarge"
                       class="max-h-96 w-full cursor-zoom-in rounded-lg object-contain"
                       @click="shotFull = true" />
                </template>
              </div>
            </div>
          </section>

          <!-- Processes -->
          <section class="card bg-base-100 shadow">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Running apps</h2>
                <button class="btn btn-ghost btn-sm" @click="loadProcesses()" :disabled="loadingProcs">
                  <span x-show="loadingProcs" class="loading loading-spinner loading-xs"></span>
                  Refresh
                </button>
              </div>
              <div class="mt-2 max-h-96 overflow-y-auto">
                <table class="table table-pin-rows table-sm">
                  <thead>
                    <tr><th scope="col">App</th><th scope="col" class="text-right">Memory</th><th scope="col"><span class="sr-only">Actions</span></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="p in processes" :key="p.pid">
                      <tr>
                        <td class="truncate" x-text="p.name"></td>
                        <td class="text-right whitespace-nowrap" x-text="fmtBytes(p.memory_bytes)"></td>
                        <td class="text-right">
                          <button class="btn btn-error btn-xs" @click="askKill(p)">Kill</button>
                        </td>
                      </tr>
                    </template>
                    <template x-if="processes.length === 0 && !loadingProcs">
                      <tr><td colspan="3" class="text-center opacity-50">No processes</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- Curfew -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Curfew</h2>
                <input type="checkbox" class="toggle toggle-warning" x-model="curfew.enabled" />
              </div>
              <p class="text-sm opacity-70">
                When the PC is on during a closed window, it shuts down (with a warning countdown).
              </p>

              <!-- Simple single window (shown until you add day-specific schedules) -->
              <template x-if="!curfew.windows || curfew.windows.length === 0">
                <div class="mt-2 flex flex-wrap items-end gap-3">
                  <label class="form-control">
                    <span class="label-text mb-1">From</span>
                    <input type="time" x-model="curfew.start" class="input input-bordered" />
                  </label>
                  <label class="form-control">
                    <span class="label-text mb-1">Until</span>
                    <input type="time" x-model="curfew.end" class="input input-bordered" />
                  </label>
                </div>
              </template>

              <!-- Per-day schedules (authoritative when present) -->
              <template x-if="curfew.windows && curfew.windows.length > 0">
                <div class="mt-2 flex flex-col gap-3">
                  <template x-for="(w, i) in curfew.windows" :key="i">
                    <div class="flex flex-wrap items-end gap-2 rounded-lg bg-base-200 p-2">
                      <label class="form-control">
                        <span class="label-text mb-1 text-xs">From</span>
                        <input type="time" x-model="w.start" class="input input-bordered input-sm" />
                      </label>
                      <label class="form-control">
                        <span class="label-text mb-1 text-xs">Until</span>
                        <input type="time" x-model="w.end" class="input input-bordered input-sm" />
                      </label>
                      <div class="flex items-end gap-1">
                        <template x-for="d in ['mon','tue','wed','thu','fri','sat','sun']" :key="d">
                          <label class="flex flex-col items-center text-xs">
                            <span class="uppercase opacity-70" x-text="d[0]"></span>
                            <input type="checkbox" class="checkbox checkbox-xs" x-model="w.days[d]" />
                          </label>
                        </template>
                      </div>
                      <button class="btn btn-ghost btn-xs" aria-label="Remove window" @click="removeWindow(i)">✕</button>
                    </div>
                  </template>
                  <p class="text-xs opacity-60">No day selected = every day.</p>
                </div>
              </template>

              <div class="mt-3 flex flex-wrap items-end gap-3">
                <button class="btn btn-ghost btn-sm" @click="addWindow()">+ Add day schedule</button>
                <label class="form-control">
                  <span class="label-text mb-1">Warning (sec)</span>
                  <input type="number" min="0" max="600" x-model.number="curfew.warn_secs"
                         class="input input-bordered w-28" />
                </label>
                <button class="btn btn-primary" @click="saveCurfew()" :disabled="savingCurfew">
                  <span x-show="savingCurfew" class="loading loading-spinner loading-sm"></span>
                  Save
                </button>
              </div>
            </div>
          </section>

          <!-- Today's screen time (live tally). Always rendered: `used_mins` is tracked even
               with no budget set, and "he's been on 2h today" is useful on its own. Hiding this
               card on a fresh install removed the one view that shows the tool working. -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">
                  Today's screen time
                  <span class="badge badge-warning badge-sm" x-show="today.enabled === false">Paused</span>
                </h2>
                <button class="btn btn-ghost btn-sm" @click="loadToday()" :disabled="loadingToday">
                  <span x-show="loadingToday" class="loading loading-spinner loading-xs"></span>
                  Refresh
                </button>
              </div>

              <!-- Enforcement liveness. Both enforcers stamp a heartbeat each tick; if neither
                   has reported recently the limits below are not being applied, and nothing else
                   on this page would look any different. -->
              <template x-if="stEnforcementStale()">
                <div class="alert alert-error mt-1">
                  <span class="text-sm">
                    <strong>Enforcement may not be running.</strong>
                    <span x-text="enforcementDetail()"></span>
                    Limits and curfew may not be applied right now — run
                    <span class="font-mono">nestwatch doctor</span> on the PC.
                  </span>
                </div>
              </template>

              <!-- Total budget bar -->
              <template x-if="today.budget_mins > 0">
                <div class="mt-1">
                  <!-- Polled every 60s (see startPolling). Without a live region these numbers
                       change silently: a screen-reader user is told the budget once, on load, and
                       never again. `atomic` so the pair is read as one sentence ("12 of 60 min
                       used, 48 min left") rather than as two orphaned numbers. The progress bar
                       below carries the same summary as an aria-label, but a changed label on a
                       non-live element is not announced — it is read only if focus lands there. -->
                  <div class="flex justify-between text-sm" aria-live="polite" aria-atomic="true">
                    <span><span class="font-semibold" x-text="today.used_mins"></span> of
                      <span x-text="today.budget_mins"></span> min used</span>
                    <span class="opacity-70"><span x-text="today.remaining_mins"></span> min left<span
                      x-show="today.extra_mins > 0" x-text="` (incl. +${today.extra_mins} bonus)`"></span></span>
                  </div>
                  <progress class="progress w-full mt-1"
                            :aria-label="`Screen time: ${today.used_mins} of ${today.budget_mins} minutes used`"
                            :class="today.remaining_mins === 0 ? 'progress-error' : (today.remaining_mins <= 15 ? 'progress-warning' : 'progress-primary')"
                            :value="today.used_mins" :max="today.budget_mins"></progress>
                </div>
              </template>

              <!-- No budget: still show the tally. Time is counted regardless, so this answers
                   "has he been on the PC today?" even before any limit exists. -->
              <template x-if="!(today.budget_mins > 0)">
                <div class="mt-1">
                  <p class="text-sm">
                    <span class="font-semibold" x-text="today.used_mins ?? 0"></span> min used today
                  </p>
                  <p class="text-sm opacity-70">
                    No daily limit set — tracking only. Set one under
                    <span class="font-medium">Screen-time &amp; app limits</span> to start enforcing.
                  </p>
                </div>
              </template>

              <!-- Parent-granted bonus time (only meaningful with a budget) -->
              <div class="mt-2 flex flex-wrap items-center gap-2" x-show="today.budget_mins > 0">
                <span class="label-text">Add bonus time today:</span>
                <button class="btn btn-outline btn-sm" @click="grantExtra(15)" :disabled="grantingExtra">+15</button>
                <button class="btn btn-outline btn-sm" @click="grantExtra(30)" :disabled="grantingExtra">+30</button>
                <button class="btn btn-outline btn-sm" @click="grantExtra(60)" :disabled="grantingExtra">+60</button>
              </div>

              <!-- Per-app usage -->
              <template x-if="today.per_app && today.per_app.length">
                <div class="mt-2">
                  <span class="label-text">Per-app usage today</span>
                  <div class="mt-1 flex flex-col gap-1">
                    <template x-for="a in today.per_app" :key="a.name">
                      <div class="flex items-center gap-2 text-sm">
                        <span class="w-48 truncate" x-text="a.name"></span>
                        <progress class="progress flex-1"
                                  :aria-label="`${a.name}: ${a.used_mins} of ${a.limit_mins} minutes`"
                                  :class="a.used_mins >= a.limit_mins ? 'progress-error' : 'progress-primary'"
                                  :value="a.used_mins" :max="a.limit_mins"></progress>
                        <span class="whitespace-nowrap opacity-70"><span x-text="a.used_mins"></span>/<span
                          x-text="a.limit_mins"></span> min</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <!-- Group (shared pool) usage -->
              <template x-if="today.groups && today.groups.length">
                <div class="mt-2">
                  <span class="label-text">App groups today</span>
                  <div class="mt-1 flex flex-col gap-1">
                    <template x-for="g in today.groups" :key="g.name">
                      <div class="flex items-center gap-2 text-sm">
                        <span class="w-48 truncate" x-text="g.name"></span>
                        <progress class="progress flex-1"
                                  :aria-label="`${g.name}: ${g.used_mins} of ${g.limit_mins} minutes`"
                                  :class="g.used_mins >= g.limit_mins ? 'progress-error' : 'progress-primary'"
                                  :value="g.used_mins" :max="g.limit_mins"></progress>
                        <span class="whitespace-nowrap opacity-70"><span x-text="g.used_mins"></span>/<span
                          x-text="g.limit_mins"></span> min</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
            </div>
          </section>

          <!-- Usage rules: budget + blocklist + per-app limits -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Screen-time &amp; app limits</h2>
                <label class="flex items-center gap-2 cursor-pointer">
                  <!-- Three states, not two. `enabled` only means "not paused"; with nothing
                       configured the enforcer skips every tick, so showing "Enforcing" on a
                       fresh install told the parent the PC was limited when it wasn't. -->
                  <span class="label-text"
                        x-text="!rules.enabled ? 'Paused' : (anyRulesSet() ? 'Enforcing' : 'Nothing set up yet')"></span>
                  <input type="checkbox" class="toggle toggle-sm toggle-primary"
                         :checked="rules.enabled"
                         @change="rules.enabled = $event.target.checked; saveRules()" />
                </label>
              </div>
              <p class="text-sm opacity-70" x-show="!rules.enabled">
                Paused — screen-time, blocked apps, and per-app limits are not enforced (curfew still applies).
              </p>
              <div class="alert alert-info mt-1" x-show="rules.enabled && !anyRulesSet()">
                <span class="text-sm">
                  No limits are set, so nothing is being enforced yet. Set a daily limit below
                  (or turn on Curfew) to start.
                </span>
              </div>

              <!-- Daily budget -->
              <label class="flex w-fit items-center gap-2 mt-1 cursor-pointer">
                <input type="checkbox" class="checkbox checkbox-sm"
                       :checked="!!rules.budget_by_weekday" @change="togglePerDay($event.target.checked)" />
                <span class="label-text">Different limit each day</span>
              </label>

              <div class="mt-1 flex flex-wrap items-end gap-3">
                <label class="form-control" x-show="!rules.budget_by_weekday">
                  <span class="label-text mb-1">Daily limit (min, 0 = off)</span>
                  <input type="number" min="0" x-model.number="rules.daily_budget_mins"
                         class="input input-bordered w-40" />
                </label>
                <label class="form-control">
                  <span class="label-text mb-1">When time's up</span>
                  <select x-model="rules.budget_action" class="select select-bordered">
                    <option value="lock">Lock screen</option>
                    <option value="shutdown">Shut down</option>
                    <option value="warn">Warn only</option>
                  </select>
                </label>
                <label class="form-control">
                  <span class="label-text mb-1">Warning (sec)</span>
                  <input type="number" min="0" max="600" x-model.number="rules.warn_secs"
                         class="input input-bordered w-28" />
                </label>
              </div>

              <!-- Per-day limits. `x-if` (not x-show) so the inputs aren't evaluated as
                   null[i] while per-day mode is off. -->
              <template x-if="rules.budget_by_weekday">
                <div class="mt-2">
                  <div class="flex flex-wrap gap-2">
                    <template x-for="(d, i) in ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']" :key="i">
                      <label class="form-control">
                        <span class="label-text mb-1 text-center" x-text="d"></span>
                        <input type="number" min="0" x-model.number="rules.budget_by_weekday[i]"
                               class="input input-bordered input-sm w-16 text-center" />
                      </label>
                    </template>
                  </div>
                  <p class="text-xs opacity-60 mt-1">
                    0 = no limit that day. To block a day entirely, use a full-day curfew window.
                  </p>
                </div>
              </template>

              <!-- Blocked apps -->
              <div class="mt-3">
                <span class="label-text">Blocked apps (killed on sight)</span>
                <div class="mt-1 flex flex-col gap-1">
                  <template x-for="(b, i) in rules.blocklist" :key="i">
                    <div class="flex items-center gap-2">
                      <input type="text" x-model="rules.blocklist[i]" placeholder="game.exe"
                             class="input input-bordered input-sm w-64" />
                      <button class="btn btn-ghost btn-xs" aria-label="Remove app" @click="rules.blocklist.splice(i, 1)">✕</button>
                    </div>
                  </template>
                  <button class="btn btn-ghost btn-sm w-fit" @click="rules.blocklist.push('')">+ Add app</button>
                </div>
              </div>

              <!-- Per-app limits -->
              <div class="mt-3">
                <span class="label-text">Per-app daily limits</span>
                <div class="mt-1 flex flex-col gap-1">
                  <template x-for="(row, i) in appLimitRows" :key="i">
                    <div class="flex items-center gap-2">
                      <input type="text" x-model="row.name" placeholder="chrome.exe"
                             class="input input-bordered input-sm w-64" />
                      <input type="number" min="0" x-model.number="row.mins" placeholder="min"
                             class="input input-bordered input-sm w-24" />
                      <button class="btn btn-ghost btn-xs" aria-label="Remove limit" @click="appLimitRows.splice(i, 1)">✕</button>
                    </div>
                  </template>
                  <button class="btn btn-ghost btn-sm w-fit"
                          @click="appLimitRows.push({ name: '', mins: 60 })">+ Add limit</button>
                </div>
              </div>

              <!-- App groups (shared pool) -->
              <div class="mt-3">
                <span class="label-text">App groups (shared daily pool)</span>
                <div class="mt-1 flex flex-col gap-1">
                  <template x-for="(g, i) in groupRows" :key="i">
                    <div class="flex flex-wrap items-center gap-2">
                      <input type="text" x-model="g.name" placeholder="Games"
                             class="input input-bordered input-sm w-32" />
                      <input type="text" x-model="g.appsText" placeholder="minecraft.exe, roblox.exe"
                             class="input input-bordered input-sm w-64" />
                      <input type="number" min="0" x-model.number="g.limit_mins" placeholder="min"
                             class="input input-bordered input-sm w-24" />
                      <button class="btn btn-ghost btn-xs" aria-label="Remove group" @click="groupRows.splice(i, 1)">✕</button>
                    </div>
                  </template>
                  <button class="btn btn-ghost btn-sm w-fit"
                          @click="groupRows.push({ name: '', appsText: '', limit_mins: 90 })">+ Add group</button>
                </div>
              </div>

              <div class="mt-3">
                <button class="btn btn-primary" @click="saveRules()" :disabled="savingRules">
                  <span x-show="savingRules" class="loading loading-spinner loading-sm"></span>
                  Save
                </button>
              </div>
            </div>
          </section>

          <!-- Routines (saved rule presets) -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Routines</h2>
                <button class="btn btn-ghost btn-sm" @click="loadRoutines()" :disabled="loadingRoutines">
                  <span x-show="loadingRoutines" class="loading loading-spinner loading-xs"></span>
                  Refresh
                </button>
              </div>
              <p class="text-sm opacity-70">
                Save the current screen-time settings above as a named preset, then switch with one
                click (e.g. Homework, Weekend). Applying a routine replaces the live settings.
              </p>
              <div class="mt-1 flex flex-wrap items-end gap-2">
                <input type="text" x-model="newRoutineName" maxlength="40" placeholder="Homework"
                       class="input input-bordered input-sm w-48" />
                <button class="btn btn-primary btn-sm" @click="saveRoutine()" :disabled="savingRoutine">
                  <span x-show="savingRoutine" class="loading loading-spinner loading-xs"></span>
                  Save current as routine
                </button>
              </div>
              <div class="mt-2 flex flex-col gap-1" x-show="routines.length > 0">
                <template x-for="name in routines" :key="name">
                  <div class="flex items-center gap-2">
                    <span class="flex-1 truncate" x-text="name"></span>
                    <button class="btn btn-success btn-xs" @click="applyRoutine(name)">Apply</button>
                    <button class="btn btn-ghost btn-xs" @click="deleteRoutine(name)">Delete</button>
                  </div>
                </template>
              </div>
              <p class="text-sm opacity-50" x-show="routines.length === 0 && !loadingRoutines">
                No saved routines.
              </p>
            </div>
          </section>

          <!-- More-time requests -->
          <section class="card bg-base-100 shadow md:col-span-2" x-show="timeRequests.length > 0">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <!-- The heading, not the table, is the live region: a request arriving mid-session
                     should announce "More-time requests 2", not re-read every row. The child is
                     waiting on this one — it is the panel where a missed update has a person
                     behind it. -->
                <h2 class="card-title text-base" aria-live="polite" aria-atomic="true">
                  More-time requests
                  <span class="badge badge-primary" x-text="timeRequests.length"></span>
                </h2>
                <button class="btn btn-ghost btn-sm" @click="loadTimeRequests()">Refresh</button>
              </div>
              <div class="mt-2 max-h-72 overflow-y-auto">
                <table class="table table-pin-rows table-sm">
                  <thead>
                    <tr><th scope="col">Time</th><th scope="col">Minutes</th><th scope="col">Reason</th><th scope="col"><span class="sr-only">Actions</span></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="r in timeRequests" :key="r.id">
                      <tr>
                        <td class="whitespace-nowrap" x-text="fmtTime(r.ts)"></td>
                        <td x-text="r.minutes"></td>
                        <td class="truncate" x-text="r.reason || '—'"></td>
                        <td class="text-right whitespace-nowrap">
                          <button class="btn btn-success btn-xs" @click="resolveTimeRequest(r.id, 'approve')">Approve</button>
                          <button class="btn btn-error btn-xs" @click="resolveTimeRequest(r.id, 'deny')">Deny</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- Time codes -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Time codes</h2>
                <button class="btn btn-ghost btn-sm" @click="loadCodes()" :disabled="loadingCodes">
                  <span x-show="loadingCodes" class="loading loading-spinner loading-xs"></span>
                  Refresh
                </button>
              </div>
              <p class="text-sm opacity-70">
                Generate a one-time code worth N minutes and hand it over — it's redeemed on the
                child's page, even while you're away.
              </p>
              <!-- The full URL, copyable. Naming the path alone left the parent to reconstruct
                   scheme + IP + port from memory to tell their child where to go. -->
              <div class="mt-1 flex flex-wrap items-center gap-2">
                <span class="label-text">Child's page:</span>
                <code class="text-xs break-all" x-text="askUrl()"></code>
                <button class="btn btn-ghost btn-xs" @click="copyAskUrl()"
                        aria-label="Copy the child's page link">Copy link</button>
              </div>
              <div class="mt-1 flex flex-wrap items-end gap-2">
                <label class="form-control">
                  <span class="label-text mb-1">Minutes</span>
                  <input type="number" min="1" max="240" x-model.number="newCodeMins"
                         class="input input-bordered w-28" />
                </label>
                <button class="btn btn-primary" @click="issueCode()" :disabled="issuingCode">
                  <span x-show="issuingCode" class="loading loading-spinner loading-sm"></span>
                  Generate code
                </button>
              </div>
              <div class="mt-2 max-h-60 overflow-y-auto" x-show="codes.length > 0">
                <table class="table table-pin-rows table-sm">
                  <thead>
                    <tr><th scope="col">Code</th><th scope="col">Minutes</th><th scope="col">Created</th><th scope="col"><span class="sr-only">Actions</span></th></tr>
                  </thead>
                  <tbody>
                    <template x-for="c in codes" :key="c.code">
                      <tr>
                        <td class="font-mono text-base tracking-widest" x-text="c.code"></td>
                        <td x-text="c.minutes"></td>
                        <td class="whitespace-nowrap" x-text="fmtTime(c.ts)"></td>
                        <td class="text-right">
                          <button class="btn btn-ghost btn-xs" @click="copyCode(c.code)">Copy</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
              <p class="text-sm opacity-50" x-show="codes.length === 0 && !loadingCodes">
                No active codes.
              </p>
            </div>
          </section>

          <!-- Recent access -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Recent access</h2>
                <button class="btn btn-ghost btn-sm" @click="loadAudit()" :disabled="loadingAudit">
                  <span x-show="loadingAudit" class="loading loading-spinner loading-xs"></span>
                  Refresh
                </button>
              </div>
              <p class="text-sm opacity-70">
                Logins and actions on this PC, newest first. Watch for a sign-in you don't recognise.
              </p>
              <div class="mt-2 max-h-72 overflow-y-auto">
                <table class="table table-pin-rows table-sm">
                  <thead>
                    <tr><th scope="col">Time</th><th scope="col">Event</th><th scope="col">Source</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="(e, i) in audit" :key="i">
                      <tr :class="e.event === 'auth_failure' ? 'text-error' : ''">
                        <td class="whitespace-nowrap" x-text="fmtTime(e.ts)"></td>
                        <td x-text="e.event"></td>
                        <td class="whitespace-nowrap" x-text="e.src_ip || '—'"></td>
                      </tr>
                    </template>
                    <template x-if="audit.length === 0 && !loadingAudit">
                      <tr><td colspan="3" class="text-center opacity-50">No events yet</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- Screen-time report -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Screen time</h2>
                <button class="btn btn-ghost btn-sm" @click="loadScreentime()" :disabled="loadingScreentime">
                  <span x-show="loadingScreentime" class="loading loading-spinner loading-xs"></span>
                  Refresh
                </button>
              </div>

              <template x-if="stEnforcementStale()">
                <div role="status" class="alert alert-warning mt-2 py-2 text-sm">
                  <span>⚠ Enforcement may not have been running — days below can be missing rather than quiet.</span>
                </div>
              </template>

              <div class="mt-2 flex flex-wrap gap-4 text-sm">
                <div><span class="opacity-70">Total</span>
                  <span class="ml-1 font-semibold" x-text="`${screentime.total_mins} min`"></span></div>
                <div><span class="opacity-70">Daily average</span>
                  <span class="ml-1 font-semibold"
                        x-text="screentime.daily_avg_mins == null ? '—' : `${screentime.daily_avg_mins} min`"></span></div>
                <div><span class="opacity-70">Measured days</span>
                  <span class="ml-1 font-semibold"
                        x-text="`${screentime.measured_days}/${screentime.days.length}`"></span></div>
                <div class="opacity-70" x-text="stChangeLabel()"></div>
              </div>

              <!-- The bars are HTML, not SVG, and must stay that way.
                   Alpine's x-for only works on a <template>, and a <template> written inside
                   <svg> is parsed into the SVG namespace, where it is not an HTMLTemplateElement
                   and has no `.content`. Alpine reads `template.content.children`, throws
                   "Cannot read properties of undefined", and renders *no bars at all* — which is
                   what 0.2.3 shipped: thirty days of data drawing an empty chart, with only
                   console errors to say so. Nothing in the Rust suite can see a namespace bug, so
                   `web::tests::no_alpine_template_inside_svg` guards the shape instead.
                   Per-bar hover text is a plain `title` attribute here, which is also more
                   reliable than SVG's <title> element. -->
              <div class="mt-3 flex h-28 w-full items-end gap-px" role="img"
                   aria-label="Daily screen-time minutes; hatched columns are days that were not measured">
                <template x-for="d in screentime.days" :key="d.date">
                  <div class="min-w-0 flex-1 rounded-sm" :title="stBarTitle(d)"
                       :class="stBarClass(d)" :style="stBarStyle(d)"></div>
                </template>
              </div>

              <div class="mt-1 flex flex-wrap items-center gap-3 text-xs opacity-70">
                <span><span class="inline-block h-2 w-3 align-middle bg-primary"></span> within budget</span>
                <span><span class="inline-block h-2 w-3 align-middle bg-error"></span> over budget</span>
                <span><span class="inline-block h-2 w-3 align-middle bg-base-200 border border-base-content/40"></span> not measured</span>
              </div>

              <!-- Text alternative for the chart above: the SVG <title> elements sit on
                   non-focusable <rect>s and aren't reliably reachable by assistive tech, so this
                   list carries the same per-day data in a form that's readable and scrollable.
                   Deliberately newest first — the opposite of the chart's oldest-first left-to-
                   right order — because a scrolling list reads better with "now" at the top; this
                   is not a mismatched bug. -->
              <p class="mt-3 label-text">Day by day (newest first)</p>
              <div class="mt-1 max-h-40 overflow-y-auto">
                <table class="table table-pin-rows table-sm">
                  <thead>
                    <tr><th scope="col">Date</th><th scope="col">Minutes</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="d in [...screentime.days].reverse()" :key="d.date">
                      <tr>
                        <td class="whitespace-nowrap" x-text="d.date"></td>
                        <td :class="d.minutes_used == null ? 'opacity-50' : (d.over_budget ? 'text-error' : '')"
                            x-text="stDayLabel(d)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <template x-if="stRecentAppDay()">
                <div class="mt-3">
                  <span class="label-text"
                        x-text="`Most recent measured day with app data (${stRecentAppDay().date})`"></span>
                  <div class="mt-1 flex flex-col gap-1">
                    <template x-for="a in stRecentAppDay().apps" :key="a.name">
                      <div class="flex items-center gap-2 text-sm">
                        <span class="w-48 truncate" x-text="a.name"></span>
                        <span class="opacity-70"><span x-text="a.minutes"></span> min</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <template x-if="stRecentFocusDay()">
                <div class="mt-3">
                  <span class="label-text"
                        x-text="'Time actually looking at the screen (' + stRecentFocusDay().date + ')'"></span>
                  <div class="mt-1 flex flex-col gap-1">
                    <template x-for="a in stRecentFocusDay().focused" :key="a.name">
                      <div class="flex items-center gap-2 text-sm">
                        <span class="w-48 truncate" x-text="a.name"></span>
                        <span class="opacity-70"><span x-text="a.minutes"></span> min focused</span>
                      </div>
                    </template>
                  </div>
                </div>
              </template>

              <p class="mt-3 text-xs opacity-60">
                Two different measurements. <strong>Minutes</strong> counts time this PC was
                unlocked with an app running, so a minimised app still counts;
                <strong>focused</strong> counts only while the app was the window in front, and
                stops while nobody is touching the keyboard. Per-app limits are enforced against
                the first, not the second — a game left running in the background still uses up
                its limit. Neither figure is per-account: any account signed in at this machine
                adds to the same total. The per-app <em>minutes</em> list only names apps that
                already have a limit set; the focused list names every app. A day with no focused
                figures is one nothing was watching, which is not the same as a day nothing was
                looked at.
              </p>
            </div>
          </section>

          <!-- Usage history -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <div class="flex items-center justify-between">
                <h2 class="card-title text-base">Usage history</h2>
                <button class="btn btn-ghost btn-sm" @click="loadUsage()" :disabled="loadingUsage">
                  <span x-show="loadingUsage" class="loading loading-spinner loading-xs"></span>
                  Refresh
                </button>
              </div>
              <p class="text-sm opacity-70">Screen-time and enforcement events, newest first.</p>
              <div class="mt-2 max-h-72 overflow-y-auto">
                <table class="table table-pin-rows table-sm">
                  <thead>
                    <tr><th scope="col">Time</th><th scope="col">Event</th><th scope="col">Detail</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="(e, i) in usage" :key="i">
                      <tr>
                        <td class="whitespace-nowrap" x-text="fmtTime(e.ts)"></td>
                        <td x-text="e.event"></td>
                        <td x-text="usageDetail(e)"></td>
                      </tr>
                    </template>
                    <template x-if="usage.length === 0 && !loadingUsage">
                      <tr><td colspan="3" class="text-center opacity-50">No events yet</td></tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </div>
          </section>

          <!-- Change password -->
          <section class="card bg-base-100 shadow md:col-span-2">
            <div class="card-body">
              <h2 class="card-title text-base">Change password</h2>
              <p class="text-sm opacity-70">Update the control password without reinstalling.</p>
              <!-- A real <form> with autocomplete tokens, matching the sign-in form above.
                   Two password inputs loose in a <div> are not a password change as far as the
                   browser is concerned — Chrome says so out loud ("Password field is not
                   contained in a form") — so a password manager neither fills the current one nor
                   offers to store the new one. Since the guidance here is to use a manager rather
                   than a memorable password, the page should be legible to one. Submitting via
                   the form rather than @click also makes Enter work, as it already does on the
                   sign-in screen. -->
              <form class="mt-2 flex flex-wrap items-end gap-3" @submit.prevent="changePassword()">
                <label class="form-control">
                  <span class="label-text mb-1">Current</span>
                  <input type="password" x-model="pwCurrent" autocomplete="current-password"
                         class="input input-bordered" placeholder="••••••••" />
                </label>
                <label class="form-control">
                  <span class="label-text mb-1">New</span>
                  <input type="password" x-model="pwNew" autocomplete="new-password"
                         class="input input-bordered" placeholder="at least 8 characters" />
                </label>
                <button class="btn btn-primary" :disabled="savingPw || !pwCurrent || !pwNew">
                  <span x-show="savingPw" class="loading loading-spinner loading-sm"></span>
                  Update
                </button>
              </form>
            </div>
          </section>
        </main>

        <!-- Which build is on this PC, and whether it is the current one.
             The check runs in the parent's browser: checkForUpdate() asks api.github.com from
             this page, on the parent's own device, and only on a click. The monitored PC still
             contacts nothing -- it serves this page and no more, which is what "nothing leaves
             the house" means, and is promised in the README, on the project page and in
             SECURITY.md. That one host is the only thing `connect-src` admits beyond 'self', and
             a test in src/security.rs fails if a second one is ever added. -->
        <footer class="mx-auto w-full max-w-5xl px-4 pb-6 text-center text-xs opacity-60
                       xl:max-w-7xl 2xl:max-w-[110rem]">
          Nestwatch <span x-text="version || '—'"></span> on this PC ·
          <a class="link"
             href="https://github.com/emrecdr/nestwatch/releases/latest"
             target="_blank" rel="noopener noreferrer">releases</a>
          ·
          <button class="link" @click="checkForUpdate()" :disabled="checkingUpdate">
            <span x-show="checkingUpdate" class="loading loading-spinner loading-xs"></span>
            check for a newer version
          </button>

          <template x-if="updateState === 'current'">
            <span class="block pt-1 text-success">✓ This is the latest release.</span>
          </template>
          <template x-if="updateState === 'newer'">
            <span class="block pt-1 text-warning">
              <span x-text="latestVersion"></span> is available — this PC has
              <span x-text="version"></span>.
              <a class="link" :href="latestUrl" target="_blank" rel="noopener noreferrer">
                what changed</a>
            </span>
          </template>
          <template x-if="updateState === 'ahead'">
            <span class="block pt-1 opacity-75">
              This PC is running <span x-text="version"></span>, newer than the latest
              release (<span x-text="latestVersion"></span>).
            </span>
          </template>
          <template x-if="updateState === 'failed'">
            <span class="block pt-1 text-error" x-text="updateError"></span>
          </template>

          <span class="block pt-1 opacity-75">
            This PC never contacts the internet. The check runs in
            <em>this</em> browser, on the device you are reading this on, and only when you
            press it.
          </span>
        </footer>
      </div>
    </template>

    <!-- ── Confirm: kill ────────────────────────────────────────────── -->
    <div class="modal" :class="{ 'modal-open': killTarget }">
      <div class="modal-box">
        <h3 class="text-lg font-bold">Close app?</h3>
        <p class="py-2">
          Terminate <span class="font-semibold" x-text="killTarget?.name"></span>
          (PID <span x-text="killTarget?.pid"></span>)? Unsaved work may be lost.
        </p>
        <div class="modal-action">
          <button class="btn btn-ghost" @click="killTarget = null">Cancel</button>
          <button class="btn btn-error" @click="killProcess()">Kill</button>
        </div>
      </div>
    </div>

    <!-- ── Confirm: shutdown ────────────────────────────────────────── -->
    <div class="modal" :class="{ 'modal-open': confirmShutdown }">
      <div class="modal-box">
        <h3 class="text-lg font-bold">Shut down this PC?</h3>
        <p class="py-2">The machine will power off in a few seconds.</p>
        <div class="modal-action">
          <button class="btn btn-ghost" @click="confirmShutdown = false">Cancel</button>
          <button class="btn btn-warning" @click="doShutdown()">Shut down</button>
        </div>
      </div>
    </div>

    <!-- ── Screenshot, full size ────────────────────────────────────
         Not a DaisyUI modal-box: that is width-constrained, which is the exact problem. A plain
         fixed overlay lets the image use the whole window, and `object-contain` keeps the aspect
         ratio so a 16:9 desktop is never stretched.

         Live refresh keeps working while open -- `shotUrl` is the same reactive value the
         thumbnail binds to, so the toggle updates this view too. -->
    <div x-show="shotFull" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center bg-black/90 p-2"
         @click="closeShotFull()"
         @keydown.escape.window="closeShotFull()"
         role="dialog" aria-modal="true" aria-label="Screenshot, full size">
      <!-- .stop so clicking the picture does not dismiss it; only the backdrop does. -->
      <img :src="shotUrl" alt="screen of the monitored PC"
           class="max-h-full max-w-full object-contain" @click.stop />
      <div class="absolute right-4 top-4 flex gap-2" @click.stop>
        <button class="btn btn-sm" @click="takeScreenshot()" :disabled="loadingShot">
          <span x-show="loadingShot" class="loading loading-spinner loading-xs"></span>
          Refresh
        </button>
        <button class="btn btn-sm" @click="toggleBrowserFullscreen($el.closest('[role=dialog]'))">
          ⛶ Fullscreen
        </button>
        <button class="btn btn-sm btn-ghost text-white" @click="closeShotFull()">✕ Close</button>
      </div>
      <p class="absolute bottom-3 left-0 right-0 text-center text-xs text-white/50">
        Esc or click the backdrop to close
      </p>
    </div>

    <!-- ── Toasts ───────────────────────────────────────────────────── -->
    <div class="toast toast-end">
      <template x-for="t in toasts" :key="t.id">
        <div class="alert" :class="t.cls" x-text="t.msg"></div>
      </template>
    </div>

    <style>
      [x-cloak] { display: none !important; }
    </style>

  </body>
</html>
