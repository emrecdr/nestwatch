# Every third-party action in these workflows is pinned to a commit SHA on purpose. SHA pinning
# removes the moved-tag risk but replaces it with a quieter one: a pinned SHA never updates,
# including past an advisory. Dependabot is the half that makes pinning safe rather than merely
# frozen — it opens a PR moving the SHA, and CI decides whether it lands.
#
# The rule used to be "pin the ones that hold something": `taiki-e/install-action` executes
# downloaded binaries, `softprops/action-gh-release` holds a token that can publish, `actions/attest`
# holds a signing identity. That reading is too narrow, and the release job is where it shows.
# `dtolnay/rust-toolchain`, `Swatinem/rust-cache` and `ilammy/setup-nasm` hold nothing — they merely
# run *before* `cargo build` in a job with `id-token: write` and `attestations: write`. Anyone able
# to move one of those tags can edit the source tree between checkout and build, and the
# attestation then signs the result perfectly truthfully. Provenance says which workflow produced
# a file; it cannot say that the workflow's earlier steps left the inputs alone. So the rule is now
# positional, not by role: **anything third-party that runs in a job which builds or signs the
# artifact is SHA-pinned.**
#
# `actions/*` are first-party and stay on major tags — GitHub controls both the tag and the runner,
# so a moved tag there is not a separate trust decision from using Actions at all.
#
# `cargo deny check advisories` already fails the build on a vulnerable crate. That reports;
# this proposes the fix.
version: 2
updates:
  # GitHub Actions — rewrites pinned SHAs and keeps the `# vX` comment in step.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"

  # Rust. Grouped: this is a single-maintainer tool, and one PR per patch bump across ~40 crates
  # is noise that trains you to merge without reading.
  #
  # **Two groups, not one, because cargo and Dependabot disagree about what "minor" means.**
  # Dependabot classifies `update-types` on the literal version number with no special rule for
  # `0.x`, so `0.5.3 -> 0.6.0` is a *minor* update. In cargo it is a **breaking** one: `"0.5"`
  # resolves `>=0.5.0, <0.6.0`. That matters more here than in most repos — 24 of the ~28 direct
  # dependencies are `0.x`, including every crate holding the security boundary. A single
  # `minor-and-patch` group therefore swallowed rustls 0.23->0.24, axum 0.8->0.9, argon2 0.5->0.6
  # and tower-sessions 0.15->0.16 into the PR whose whole purpose is being safe to skim. The three
  # crates the old comment named as needing real reading — axum, rustls, tokio — were two-thirds
  # unprotected by the rule written to protect them.
  #
  # Splitting on the axis Dependabot *can* express gets the risk classes apart without bringing
  # back one-PR-per-crate:
  #
  #   patch  -> genuinely safe to skim; a 0.x patch is a patch in cargo too.
  #   minor  -> its own PR, because for a 0.x crate this is the breaking one. Still grouped, so
  #             it stays a single weekly PR, but it arrives labelled as the one to actually read.
  #   major  -> ungrouped, individual PRs, as before.
  #
  # CI is the backstop for anything that fails to compile. It is not a backstop for a bump that
  # compiles and changes behaviour — rustls cipher-suite defaults, tower-sessions cookie
  # attributes, sysinfo refresh semantics — which is exactly the shape a 0.x minor takes.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      patch:
        update-types: [patch]
      # "may be" rather than "is": a minor bump of a 1.x crate (tokio, serde, anyhow) really is
      # non-breaking. The name has to cover both, because it lands in the branch and PR title.
      minor-may-be-breaking:
        update-types: [minor]
    commit-message:
      prefix: "deps"

  # Frontend build tooling (Tailwind/DaisyUI). Build-time only — none of this ships in the .exe,
  # which is why it is grouped wholesale rather than reviewed bump by bump.
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: monthly
    groups:
      web-build:
        patterns: ["*"]
    commit-message:
      prefix: "web"
