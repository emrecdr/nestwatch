name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly, because the supply-chain gate below is the only thing that reports a new advisory
  # and it cannot report one on its own. `cargo deny check advisories` fails the build on a
  # vulnerable crate — but only when a build happens. Dependabot opens a PR when a *newer
  # version* exists, which is a different event from "an advisory landed against the version
  # you already pin": nothing about the repo changes, so nothing triggers, so nothing runs.
  # This is a tool installed on a family PC and left alone for months at a time; without this
  # line the detection window is however long the maintainer goes without pushing.
  #
  # It also re-runs `fmt` and `clippy`, which use `dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05` — a moving
  # target. A new stable's lints then surface on a quiet Monday instead of inside an unrelated PR.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  # So the same checks can be demanded on the spot, without pushing an empty commit.
  workflow_dispatch:

# Least privilege: CI only reads the repo. (Without this, the workflow inherits the repository
# default, which on older repos is read/write for every scope.) The release workflow declares
# its own `contents: write` separately.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast formatting gate (toolchain pinned via rust-toolchain.toml, so this is deterministic).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Cross-platform test: handlers/auth/config/curfew run on the FakeControl path, so the
  # suite is meaningful on both Linux and Windows.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `ring` (rustls crypto provider) assembles its primitives with NASM on the MSVC
      # target; it isn't reliably preinstalled on windows-latest. (Perl is.)
      - name: Install NASM (Windows, for ring)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend CSS
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # --locked so a test run can never silently resolve different versions than the
        # release build, which already uses it.
        run: cargo test --all-targets --locked
      # The dashboard's own logic. `node --test` ships with Node, so this adds no dependency to
      # the one that was already installed above to build the CSS. It runs on both matrix legs
      # deliberately: the harness reads assets/app.js off disk, and a Windows checkout hands it
      # CRLF — the difference that has already broken one file-reading test in this repo.
      - name: Test the dashboard script
        working-directory: web
        run: npm test

  # Supply-chain gate. BLOCKING, with no ignore list.
  #
  # This used to be `continue-on-error: true` plus two `--ignore` flags, because `cargo audit`
  # scans Cargo.lock — which lists crates that never compile on Windows (xcap's Linux/Wayland
  # backend and its dependencies). That made the job permanently red, so it was made advisory,
  # which meant a real advisory would have landed somewhere nobody looks. `cargo deny` resolves
  # the graph for the shipped target instead, so those crates are legitimately absent and the
  # check can fail the build honestly. Policy lives in deny.toml.
  #
  # All four policies run. `licenses` and `bans` were defined in deny.toml but left off this
  # command line, so the allow-list — which excludes GPL/AGPL/LGPL — was never enforced: a
  # copyleft dependency could have landed against a repo that advertises MIT. Both pass today,
  # so turning them on costs nothing and catches the dependency that doesn't.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      # Pinned to a commit: this action downloads and executes binaries, so a moved tag would be
      # arbitrary code execution in CI.
      - uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2
        with:
          # Version-pinned too: the action is commit-pinned, but an unpinned `tool:` resolves to
          # @latest, so a cargo-deny release could change what this gate accepts with no commit
          # here. Bump deliberately.
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories sources licenses bans

  # Produce the shippable Windows .exe. Only on main / tags (not every branch/PR push), and not
  # on the weekly run: `test (windows-latest)` already builds and tests on Windows there, so this
  # job would only re-package an artifact nobody downloads. A scheduled run reports `github.ref`
  # as the default branch, so without the event check it would match the condition below.
  windows-release:
    if: >-
      github.event_name != 'schedule'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install NASM (for ring)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend CSS
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: nestwatch-windows-exe
          path: target/release/nestwatch.exe
