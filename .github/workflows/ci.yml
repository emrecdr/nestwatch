name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # Weekly, because the supply-chain gate below is the only thing that reports a new advisory
  # and it cannot report one on its own. `cargo deny check advisories` fails the build on a
  # vulnerable crate — but only when a build happens. Dependabot opens a PR when a *newer
  # version* exists, which is a different event from "an advisory landed against the version
  # you already pin": nothing about the repo changes, so nothing triggers, so nothing runs.
  # This is a tool installed on a family PC and left alone for months at a time; without this
  # line the detection window is however long the maintainer goes without pushing.
  #
  # It also runs the `stable-lints` job below. That used to be claimed of the ordinary `fmt` and
  # `clippy` steps, on the grounds that `dtolnay/rust-toolchain` installs a moving `stable` — and
  # it was false. `rust-toolchain.toml` pins 1.96.0, and rustup ranks a toolchain *file* above
  # `rustup default`, which is the only thing that action sets (checked against the pinned SHA's
  # own action.yml: it never sets RUSTUP_TOOLCHAIN and never touches the file). So every cargo
  # invocation here has always run on 1.96.0, and a new stable's lints have never once surfaced.
  # `build.rs::warn_on_toolchain_mismatch` already said so — "CI uses 1.96.0" — which means two
  # files in this repo disagreed and the comment was the wrong one.
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  # So the same checks can be demanded on the spot, without pushing an empty commit.
  workflow_dispatch:

# Least privilege: CI only reads the repo. (Without this, the workflow inherits the repository
# default, which on older repos is read/write for every scope.) The release workflow declares
# its own `contents: write` separately.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast formatting gate (toolchain pinned via rust-toolchain.toml, so this is deterministic).
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Cross-platform test: handlers/auth/config/curfew run on the FakeControl path, so the
  # suite is meaningful on both Linux and Windows.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # `ring` (rustls crypto provider) assembles its primitives with NASM on the MSVC
      # target; it isn't reliably preinstalled on windows-latest. (Perl is.)
      - name: Install NASM (Windows, for ring)
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend CSS
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # --locked so a test run can never silently resolve different versions than the
        # release build, which already uses it.
        run: cargo test --all-targets --locked
      # The dashboard's own logic. `node --test` ships with Node, so this adds no dependency to
      # the one that was already installed above to build the CSS. It runs on both matrix legs
      # deliberately: the harness reads assets/app.js off disk, and a Windows checkout hands it
      # CRLF — the difference that has already broken one file-reading test in this repo.
      - name: Test the dashboard script
        working-directory: web
        run: npm test

      # Doc cross-references, which nothing else here reaches.
      #
      # Eight `///` links resolved to nothing when this was first measured — five wrong paths
      # (`countdown::WARN_AT_MINS` where `countdown` is a crate-root module; `[`recent`]` needing
      # `Self::`) and three pointing at items private to another module or declared inside a
      # function body, which rustdoc cannot resolve at all. None was a regression anyone let
      # through: no gate had ever run rustdoc, so the count only ever went up.
      #
      # **Windows only, and that is the whole design.** Half the crate is `#[cfg(windows)]`, so on
      # Linux a link to `crate::watcher` or `terminate_resident_helpers` is unresolvable because
      # the item is not compiled — not because the link is wrong. Running this on both legs would
      # fail permanently on two correct links, which is how a gate gets marked advisory and then
      # ignored. Measured both ways before choosing: 0 unresolved against a Windows target, 2
      # against the host.
      #
      # `-D rustdoc::broken_intra_doc_links` rather than `-D warnings`, deliberately. The other 20
      # warnings are `pub` docs linking to private items, which is cosmetic for a crate that sets
      # `publish = false` and whose rustdoc nobody reads. Denying all of them would mean 20 edits
      # up front to buy nothing, and the useful half — a link that points at nothing — would arrive
      # bundled with noise. `--document-private-items` is still passed so private items are
      # *reachable*; it is what makes the majority of these links resolve at all.
      - name: Doc links
        if: runner.os == 'Windows'
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
        run: cargo doc --no-deps --document-private-items

  # The moving-target lint check the schedule comment above used to claim for free.
  #
  # `cargo +stable` is the one override that beats `rust-toolchain.toml` — rustup ranks an explicit
  # `+toolchain` above the file — so this is the only way to ask "what does *today's* compiler think
  # of this code" without unpinning the build everything else depends on.
  #
  # **Scheduled and manual only, and BLOCKING when it runs.** Both halves are deliberate. Running it
  # on every PR would let an unrelated change go red because a new stable shipped a lint that
  # morning, which is exactly what the pin exists to prevent. Making it advisory would repeat the
  # mistake this file already records for `cargo audit`: a job that is allowed to fail is a job
  # nobody reads. On a Monday there is nothing else in flight, so red means "go and look".
  #
  # Safe to add as blocking because it was measured first, not assumed: `cargo +1.98.0 clippy
  # --all-targets` (1.98.0 being current stable, 2026-08-18, two releases past the pin) reports
  # **zero** warnings on this tree as of 2026-09-01. The pin has cost no lint debt so far; this is
  # what stops the next two releases' worth from accumulating unseen.
  #
  # Linux only. The Windows leg would need NASM and the frontend build to say anything new about
  # lints, and `test (windows-latest)` already covers the `#[cfg(windows)]` half on the pinned
  # toolchain. If a stable lint ever fires only on Windows code, this misses it — accepted, because
  # the alternative is doubling a job that exists to read a warning list.
  stable-lints:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # `build.rs` fails the build if assets/app.css is missing, so the CSS has to exist even for
      # a lint-only run.
      - name: Build frontend CSS
        working-directory: web
        run: |
          npm ci
          npm run build
      # Not `--locked`: this asks about the compiler, not the dependency graph, and the pinned
      # jobs above are what hold the lockfile honest.
      - name: Clippy on today's stable
        run: cargo +stable clippy --all-targets -- -D warnings

  # Supply-chain gate. BLOCKING, with no ignore list.
  #
  # This used to be `continue-on-error: true` plus two `--ignore` flags, because `cargo audit`
  # scans Cargo.lock — which lists crates that never compile on Windows (xcap's Linux/Wayland
  # backend and its dependencies). That made the job permanently red, so it was made advisory,
  # which meant a real advisory would have landed somewhere nobody looks. `cargo deny` resolves
  # the graph for the shipped target instead, so those crates are legitimately absent and the
  # check can fail the build honestly. Policy lives in deny.toml.
  #
  # All four policies run. `licenses` and `bans` were defined in deny.toml but left off this
  # command line, so the allow-list — which excludes GPL/AGPL/LGPL — was never enforced: a
  # copyleft dependency could have landed against a repo that advertises MIT. Both pass today,
  # so turning them on costs nothing and catches the dependency that doesn't.
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      # Pinned to a commit: this action downloads and executes binaries, so a moved tag would be
      # arbitrary code execution in CI.
      - uses: taiki-e/install-action@1ed6d7be6168f6c9046541087ff549b6bc581fdf # v2
        with:
          # Version-pinned too: the action is commit-pinned, but an unpinned `tool:` resolves to
          # @latest, so a cargo-deny release could change what this gate accepts with no commit
          # here. Bump deliberately.
          tool: cargo-deny@0.20.2
      - run: cargo deny check advisories sources licenses bans

  # Produce the shippable Windows .exe. Only on main / tags (not every branch/PR push), and not
  # on the weekly run: `test (windows-latest)` already builds and tests on Windows there, so this
  # job would only re-package an artifact nobody downloads. A scheduled run reports `github.ref`
  # as the default branch, so without the event check it would match the condition below.
  windows-release:
    if: >-
      github.event_name != 'schedule'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: windows-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install NASM (for ring)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend CSS
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v7
        with:
          name: nestwatch-windows-exe
          path: target/release/nestwatch.exe
