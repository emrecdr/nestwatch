name: release

# Tag a release: `git tag v0.1.0 && git push --tags`.
on:
  push:
    tags: ["v*"]

# Least privilege at the workflow level; the `release` job widens this for itself below.
# `verify` only reads the repo, so it should not inherit the token that can publish.
permissions:
  contents: read

jobs:
  # Gate: never publish a binary that doesn't pass the same checks as CI.
  #
  # `needs:` only works between jobs in ONE workflow, and this is a separate workflow from
  # ci.yml — a tag push starts both in parallel, so without this the release could publish
  # while (or even after) CI fails. Mirroring the checks here rather than depending on ci.yml
  # is the only self-contained way to make the gate real. Runs on Windows because that's the
  # target that actually ships.
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      # The tag and the manifest must agree, and nothing else checks that they do.
      #
      # Releases are tagged by hand. A tag of v0.3.0 against a Cargo.toml still reading 0.2.3
      # publishes a binary that reports the wrong version from `version` and `doctor` — and from
      # the install record, which decides whether an install is an upgrade or a reinstall. The
      # release page would say one number while the thing it links to says another, and nobody
      # would find out until someone ran `doctor` on a real machine and believed it.
      #
      # First on purpose: it costs a second and fails before the toolchain, the build, the tests,
      # or anything that publishes. `awk` over the `[package]` table rather than `cargo metadata`
      # or a bare grep — it needs no toolchain (so it really can run first), and scoping to the
      # table means neither `rust-version` nor a dependency's version can be read as the crate's.
      - name: Tag matches Cargo.toml
        shell: bash
        run: |
          manifest=$(awk '/^\[package\]/{p=1;next} /^\[/{p=0} p && /^version[ \t]*=/{gsub(/["]/,"",$3); print $3; exit}' Cargo.toml)
          tag="${GITHUB_REF_NAME#v}"
          if [ -z "$manifest" ]; then
            echo "::error::could not read a version from Cargo.toml's [package] table"
            exit 1
          fi
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME says $tag, Cargo.toml says $manifest — bump one to match the other"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml $manifest"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install NASM (for ring)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend CSS
        working-directory: web
        run: |
          npm ci
          npm run build
      - run: cargo fmt --all -- --check
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        # --locked so a test run can never silently resolve different versions than the
        # release build, which already uses it.
        run: cargo test --all-targets --locked

  # The DATA plane: turns source into an .exe, and holds no signing identity while doing it.
  #
  # Split from `publish` on purpose, and the split is the security control — not tidiness.
  # An attestation proves *which workflow produced this file*; it cannot prove the workflow's
  # earlier steps left the tree alone. While build and signing shared one job, anyone who could
  # move a tag on one of the three third-party actions below — or land a build script in a
  # dependency — had arbitrary code execution in a job holding `id-token: write`, *before*
  # `cargo build` ran. They patch a file, the build proceeds, and the attestation signs the
  # result truthfully. `gh attestation verify` then passes, and the README tells the parent that
  # check is the strong one. The artifact installs as a SYSTEM service on a child's PC.
  #
  # Separating the user-defined build steps from the provenance generation is what SLSA calls
  # Build L3: the data plane cannot reach the control plane's identity, because this job is
  # never issued one. Note `permissions` here is `contents: read` and nothing else.
  build:
    needs: [verify]
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch @ 2026-08-05
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Install NASM (for ring)
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend CSS
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Build release binary
        run: cargo build --release --locked
      # Stage both files under one directory so the artifact has a flat root: `upload-artifact`
      # roots an artifact at the common ancestor of its paths, and `target/release/nestwatch.exe`
      # plus a workspace-root `.sha256` would root it at the workspace — arriving in the next job
      # as `dist/target/release/...`, which the publish steps would then have to know about.
      #
      # Emit "<hash>  nestwatch.exe" so the file is consumable by `sha256sum -c` / `shasum -c`.
      # A bare hash with no filename can't be checked by either.
      - name: Stage the artifact and its checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/nestwatch.exe dist/
          $hash = (Get-FileHash dist/nestwatch.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  nestwatch.exe" | Out-File -Encoding ascii -NoNewline dist/nestwatch.exe.sha256
      - name: Hand the artifact to the signing job
        uses: actions/upload-artifact@v7
        with:
          name: release-dist
          path: dist/
          # A silent empty upload here would surface as a confusing failure in `publish`, one job
          # away from the cause.
          if-no-files-found: error
          retention-days: 1

  # The CONTROL plane: signs and publishes. Runs no build step, no third-party action, and no
  # code from this repository other than the release-notes script below.
  publish:
    needs: [build]
    runs-on: windows-latest
    # `contents` publishes the release; `id-token` + `attestations` sign and store the build
    # provenance. Scoped to this job so neither `verify` nor `build` can publish or sign.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # Needed only for CHANGELOG.md and .github/release-footer.md, which the notes step reads.
      # The binary is NOT rebuilt here — it arrives from `build` as an artifact.
      - uses: actions/checkout@v7
      # v8, not v7: this pair is not released in lockstep — `upload-artifact` is on v7 while
      # `download-artifact` is on v8. Checked rather than assumed.
      - uses: actions/download-artifact@v8
        with:
          name: release-dist
          path: dist
      # Sign a SLSA build-provenance statement binding this exact .exe to this repo, workflow
      # and commit. The .sha256 above only proves the download wasn't corrupted — it is produced
      # by this same workflow, so anyone able to publish a release could publish a matching hash.
      # The attestation is what makes "this came from nestwatch's release workflow" checkable:
      #
      #   gh attestation verify nestwatch.exe --repo emrecdr/nestwatch
      #
      # `actions/attest-build-provenance` is the name most guides still show; it is deprecated in
      # favour of `actions/attest`, which it now merely wraps. Commit-pinned for the same reason
      # as the publish action below — this one holds a signing identity.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/nestwatch.exe
      # Build the release notes from CHANGELOG.md plus a fixed verification footer.
      #
      # With no body, `action-gh-release` publishes an empty release -- a tag and two files, and
      # nothing saying what changed. v0.1.0 through v0.2.1 all looked like that while a perfectly
      # good changelog sat in the repo. The release page is where someone lands when downloading,
      # so it carries this tag's section and the checks to run before executing an .exe as SYSTEM.
      #
      # This FAILS the release when the changelog has no section for the tag. An empty body is
      # how this went wrong the first time, so it must not be able to happen quietly again.
      #
      # The footer lives in .github/release-footer.md rather than inline: a PowerShell here-string
      # has to start at column 0, which would end the YAML block scalar this runs in.
      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $lines = Get-Content CHANGELOG.md
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+\[$([regex]::Escape($version))\]") { $start = $i + 1; break }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md has no '## [$version]' section. Add one before tagging."
          }
          $body = @()
          for ($i = $start; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+\[') { break }
            $body += $lines[$i]
          }
          $text = ($body -join "`n").Trim()
          if (-not $text) { throw "The '## [$version]' section in CHANGELOG.md is empty." }
          $footer = (Get-Content .github/release-footer.md -Raw) -replace '__COMMIT__', '${{ github.sha }}'
          ($text + "`n" + $footer) | Out-File -Encoding utf8 RELEASE_NOTES.md
          Write-Host "----- release notes -----"
          Get-Content RELEASE_NOTES.md
      # Pinned to a commit: this action holds a token that can publish releases, so a moved tag
      # would be able to publish on our behalf.
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/nestwatch.exe
            dist/nestwatch.exe.sha256
